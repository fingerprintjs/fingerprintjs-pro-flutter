# Temporary. Round 1 validated the fix for flutter#181771 (no hangs in 12 runs) and exposed a
# second flake: the iOS simulator turns accessibility on at an unpredictable moment, and when it
# lands mid-test the framework's end-of-test handle check fails. This round instruments the
# transition and probes two candidate mitigations. Delete this workflow with its branch.
name: iOS soak

on:
  push:
    branches:
      - e2e-ios-soak

permissions:
  contents: read

jobs:
  ios:
    name: "iOS ${{ matrix.variant }} ${{ matrix.run }}"
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        variant: [plain, simdefault, presemantics]
        run: [1, 2, 3, 4]
    env:
      API_KEY: ${{ secrets.API_KEY }}
      REGION: ${{ secrets.REGION }}
      ENDPOINT: ${{ secrets.ENDPOINT }}
      SCRIPT_URL_PATTERN: ${{ secrets.SCRIPT_URL_PATTERN }}
    defaults:
      run:
        working-directory: fpjs_pro_plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: fpjs_pro_plugin
      - name: Install Flutter latest stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: stable
          cache: true
      - name: Restore packages
        working-directory: fpjs_pro_plugin/example
        run: flutter pub get
      - name: Write .env.local
        run: DISABLE_LOCATION_COLLECTION=true ./.github/scripts/write_e2e_env.sh
      - name: Start iOS simulator
        id: simulator
        uses: futureware-tech/simulator-action@e89aa8f93d3aec35083ff49d2854d07f7186f7f5 #v5
        with:
          model: iPhone 16
          wait_for_boot: true
      # Candidate mitigation: have accessibility already on before the app launches, so the
      # framework records the platform's semantics handle before the test starts rather than
      # gaining one midway through it.
      - name: Force simulator accessibility on
        if: matrix.variant == 'simdefault'
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.Accessibility \
            ApplicationAccessibilityEnabled -bool true
          xcrun simctl spawn "$SIMULATOR_UDID" defaults read com.apple.Accessibility || true
      - name: Build smoke test app
        working-directory: fpjs_pro_plugin/example
        run: |
          flutter build ios --simulator \
            --target=integration_test/smoke_test.dart \
            --dart-define=SOAK_VARIANT=${{ matrix.variant }}
      - name: Run smoke test
        timeout-minutes: 15
        working-directory: fpjs_pro_plugin/example
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: ../.github/scripts/drive_ios_simulator.sh "$SIMULATOR_UDID"
      # Unconditional: the passing runs are the ones that say whether accessibility came on
      # before the test or never came on at all.
      - name: Dump simulator diagnostics
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 20m --style compact \
            --predicate 'processImagePath ENDSWITH "Runner"' | tail -n 200
