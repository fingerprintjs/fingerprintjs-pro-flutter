name: 'Build and run checks'
on:
  workflow_call:

jobs:
  build-examples:
    name: "Build examples for Web + Android (Flutter ${{ matrix['flutter-version'] || 'latest stable' }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: [ '3.19.0', '' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ matrix['flutter-version'] }}

      - name: Restore packages
        run: flutter pub get

      - name: Create .env.local
        run: cp ./example/.env ./example/.env.local
        shell: bash

      - name: Analyze
        run: flutter analyze

      - name: Build example (web)
        working-directory: example
        run: flutter build web

      - name: Build example (android)
        working-directory: example
        run: flutter build apk

  # iOS runs only on the latest stable Flutter, unlike the other jobs which also test an older floor.
  # The example's ios/ project is generated scaffolding that `flutter` keeps migrating to its newest
  # template; currently Swift Package Manager and the FlutterImplicitEngineDelegate AppDelegate API,
  # neither of which exists in older Flutter engines, so older versions can't even compile the example.
  # Plugin-level compatibility with older Flutter is still covered by `flutter analyze` in the other jobs.
  build-examples-ios:
    name: "Build examples for iOS"
    runs-on: macos-latest
    # Flutter's SwiftPM path override uses the Dart package name as identity
    # (https://github.com/flutter/flutter/issues/186881). actions/checkout
    # defaults to fingerprintjs-pro-flutter but the repo folder must match the package name.
    # TODO: drop the `path:` below and this `defaults:` block once flutter#188647 reaches stable.
    # It is merged to master and fixes flutter#186881, so the checkout can go back to the default.
    defaults:
      run:
        working-directory: fpjs_pro_plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: fpjs_pro_plugin

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: 'stable'

      - name: Restore packages
        run: flutter pub get

      - name: Create .env.local
        run: cp ./example/.env ./example/.env.local
        shell: bash

      - name: Analyze
        run: flutter analyze

      - name: Build example (iOS, Swift Package Manager)
        working-directory: fpjs_pro_plugin/example
        run: flutter build ios --no-codesign

      # `flutter build ios` succeeds whether or not SwiftPM picked the plugin up, so assert that it did.
      # Without this, a regression that stops Flutter from finding Package.swift leaves the job green.
      - name: Verify Swift Package Manager was used
        run: |
          manifest=example/ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          if ! grep -q 'fpjs_pro_plugin' "$manifest"; then
            echo "$manifest does not depend on fpjs_pro_plugin, SwiftPM did not pick the plugin up."
            cat "$manifest"
            exit 1
          fi

      # Disable Swift Package Manager to see if CocoaPods can build the example iOS project too
      # (https://docs.flutter.dev/packages-and-plugins/swift-package-manager/for-app-developers#how-to-turn-off-swift-package-manager).
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      # Disabling SwiftPM still leaves SwiftPM references in the Xcode project
      # We need to restore the example iOS project to a state where CocoaPods can build it.
      # -x because the SwiftPM leftovers (.swiftpm/, xcshareddata/swiftpm/) are gitignored.
      - name: Restore example iOS project
        run: |
          git checkout -- example/ios
          git clean -fdx example/ios

      - name: Build example (iOS, CocoaPods)
        working-directory: fpjs_pro_plugin/example
        run: |
          flutter clean
          flutter build ios --no-codesign

      - name: Verify CocoaPods was used
        run: |
          if [ ! -d example/ios/Pods/FingerprintPro ]; then
            echo "example/ios/Pods/FingerprintPro is missing, CocoaPods did not install the native SDK."
            ls example/ios/Pods 2>/dev/null || echo "example/ios/Pods does not exist."
            exit 1
          fi

      # `flutter config` writes to the user-level config rather than the checkout, so leaving Swift
      # Package Manager off would affect whatever runs next on the same machine. Harmless on an
      # ephemeral GitHub runner, not harmless on a self-hosted one. `always()` so a failed build
      # above still restores it.
      - name: Re-enable Swift Package Manager
        if: always()
        run: flutter config --enable-swift-package-manager

  build-and-run-checks:
    name: "Build and run checks (Flutter ${{ matrix['flutter-version'] || 'latest stable' }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ['3.19.0', '']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: 'stable'
          flutter-version: ${{ matrix['flutter-version'] }}

      - name: Restore packages
        run: flutter pub get

      - name: Create .env.local
        run: cp ./example/.env ./example/.env.local
        shell: bash

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
