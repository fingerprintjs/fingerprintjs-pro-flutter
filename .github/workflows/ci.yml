name: ci
on:
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_call:

jobs:
  analyze-and-test:
    name: "Analyze and test (Flutter ${{ matrix['flutter-version'] || 'latest stable' }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ["3.44.0", ""]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: "stable"
          flutter-version: ${{ matrix['flutter-version'] }}
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Create .env.local
        run: cp ./example/.env ./example/.env.local
        shell: bash

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Run example tests
        working-directory: example
        run: flutter test

  build-examples-web:
    name: "Build examples for Web (Flutter ${{ matrix['flutter-version'] || 'latest stable' }})"
    needs: analyze-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter-version: ["3.44.0", ""]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: "stable"
          flutter-version: ${{ matrix['flutter-version'] }}
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Create .env.local
        run: cp ./example/.env ./example/.env.local
        shell: bash

      - name: Analyze
        run: flutter analyze

      - name: Build example (web)
        working-directory: example
        run: flutter build web

      - name: Build example (web WASM)
        working-directory: example
        run: flutter build web --wasm

  build-examples-android:
    name: "Build examples for Android (Flutter ${{ matrix['flutter-version'] || 'latest stable' }}, built-in Kotlin ${{ matrix['built-in-kotlin'] }})"
    needs: analyze-and-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Flutter only understands `android.builtInKotlin` from 3.47, so 3.44 can only build with
        # the legacy fallback. Latest stable is covered in both modes: `false` is the checked-in
        # default, and Flutter implements the fallback itself, so it can change between versions.
        include:
          - flutter-version: "3.44.0"
            built-in-kotlin: "false"
          - flutter-version: ""
            built-in-kotlin: "false"
          - flutter-version: ""
            built-in-kotlin: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: "stable"
          flutter-version: ${{ matrix['flutter-version'] }}
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Create .env.local
        run: cp ./example/.env ./example/.env.local
        shell: bash

      - name: Analyze
        run: flutter analyze

      - name: Configure built-in Kotlin
        run: |
          sed -i "s/^android\.builtInKotlin=.*/android.builtInKotlin=${{ matrix['built-in-kotlin'] }}/" example/android/gradle.properties
          grep -Fx "android.builtInKotlin=${{ matrix['built-in-kotlin'] }}" example/android/gradle.properties

      - name: Build example (android)
        working-directory: example
        run: flutter build apk

      - name: Verify Kotlin bytecode target
        working-directory: example
        run: |
          plugin_class=$(find build -type f -name FpjsProPlugin.class -print -quit)
          app_class=$(find build -type f -name MainActivity.class -print -quit)

          for class_file in "$plugin_class" "$app_class"; do
            if [ -z "$class_file" ]; then
              echo "Expected Kotlin class was not compiled."
              exit 1
            fi
            major_version=$(javap -verbose "$class_file" | sed -n 's/^  major version: //p')
            if [ "$major_version" != "55" ]; then
              echo "$class_file has bytecode major version $major_version, expected 55 (Java 11)."
              exit 1
            fi
          done

  # iOS runs only on the latest stable Flutter, unlike the other jobs which also test an older floor.
  # The example's ios/ project is generated scaffolding that `flutter` keeps migrating to its newest
  # template; currently Swift Package Manager and the FlutterImplicitEngineDelegate AppDelegate API,
  # neither of which exists in older Flutter engines, so older versions can't even compile the example.
  # Plugin-level compatibility with older Flutter is still covered by `flutter analyze` in the other jobs.
  build-examples-ios:
    name: "Build examples for iOS (Flutter latest stable)"
    needs: analyze-and-test
    runs-on: macos-latest
    # Checkout as `fpjs_pro_plugin`: Flutter SwiftPM identifies path-overridden plugins by folder name
    # (https://github.com/flutter/flutter/issues/186881).
    # TODO: drop `path:` and this `defaults:` block once flutter#188647 reaches stable.
    defaults:
      run:
        working-directory: fpjs_pro_plugin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: fpjs_pro_plugin

      - name: Install and set Flutter version
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 #v2.23.0
        with:
          channel: "stable"
          cache: true

      - name: Restore packages
        run: flutter pub get

      - name: Create .env.local
        run: cp ./example/.env ./example/.env.local
        shell: bash

      - name: Analyze
        run: flutter analyze

      # CocoaPods first. Flutter migrates CocoaPods projects to SwiftPM, but not back, so the
      # committed project stays CocoaPods-shaped and this order needs no reset in between.
      # https://docs.flutter.dev/packages-and-plugins/swift-package-manager/for-app-developers#how-to-turn-off-swift-package-manager
      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Build example (iOS, CocoaPods)
        working-directory: fpjs_pro_plugin/example
        run: flutter build ios --no-codesign

      - name: Verify CocoaPods was used
        run: |
          if [ ! -d example/ios/Pods/Fingerprint-iOS ]; then
            echo "example/ios/Pods/Fingerprint-iOS is missing, CocoaPods did not install the native SDK."
            ls example/ios/Pods 2>/dev/null || echo "example/ios/Pods does not exist."
            exit 1
          fi

      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager

      - name: Build example (iOS, Swift Package Manager)
        working-directory: fpjs_pro_plugin/example
        run: |
          flutter clean
          flutter build ios --no-codesign

      # `flutter build ios` succeeds even if SwiftPM never picked this plugin up. Assert that it did.
      - name: Verify Swift Package Manager was used
        run: |
          manifest=example/ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage/Package.swift
          if ! grep -q 'fpjs_pro_plugin' "$manifest"; then
            echo "$manifest does not depend on fpjs_pro_plugin, SwiftPM did not pick the plugin up."
            cat "$manifest"
            exit 1
          fi
