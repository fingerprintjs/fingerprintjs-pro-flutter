name: fingerprint_flutter
description: Flutter plugin for the Fingerprint identification SDKs.
version: 5.0.0-test.1
homepage: https://fingerprint.com
repository: https://github.com/fingerprintjs/flutter

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: 28.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fingerprint.flutter
        pluginClass: FingerprintPlugin
      ios:
        pluginClass: FingerprintPlugin
      web:
        pluginClass: FingerprintWeb
        fileName: src/fingerprint_web.dart
  assets:
    - web/index.js

